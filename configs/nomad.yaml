services:
  api_host: "localhost"
  api_port: 80
  api_base_path: "/backend"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/exp4-age/nomad-oasis/jupyter:main

meta:
  deployment: "oasis"
  deployment_url: "https://my-oasis.org/api"
  maintainer_email: "me@my-oasis.org"

logstash:
  enabled: false

temporal:
  enabled: true
  # Keep processing serial. nomad-age parsers and normalizers read-modify-write
  # each other's .archive.yaml files (e.g. share_with_tracks writes the tracks
  # yaml that the tracks parser also writes) without a lock. With parallel
  # activities, linked entries can lose updates or read half-written yaml.
  # Only raise this after nomad-age serialises those writes.
  internal_worker:
    pool_size: 1
    max_concurrent_activities: 1

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
