# Nginx configuration for handling HTTPS requests
# - Port 80 answers Let's Encrypt HTTP-01 challenges and redirects everything
#   else to https on the canonical host name (also requests made by IP).
# - Port 443 serves the Oasis with the Let's Encrypt certificate
#   (certbot/conf, renewed daily by scripts/renew_cert.sh from cron).

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://vm193-209.its.uni-kassel.de$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/letsencrypt/live/vm193-209.its.uni-kassel.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm193-209.its.uni-kassel.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The certificate only covers the host name: send requests made by IP
    # (after the browser's certificate warning) to the name.
    if ($host != "vm193-209.its.uni-kassel.de") {
        return 301 https://vm193-209.its.uni-kassel.de$request_uri;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
